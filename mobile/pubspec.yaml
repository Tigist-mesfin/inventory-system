name: inventory_mobile
description: Inventory management mobile app with offline sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  dio: ^5.9.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^6.1.5
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.1
  build_runner: ^2.7.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/app_logo.png
    - assets/images/app_logo_fg.png
